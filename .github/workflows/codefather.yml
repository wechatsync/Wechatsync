name: Codefather adapter

on:
  push:
    branches: ['feat/codefather-adapter']
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/extension/**'
      - 'scripts/verify-codefather.cjs'
      - '.github/workflows/codefather.yml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: '匿名验证真实站点本地草稿恢复（禁止网络写入）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: codefather-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 核心单元测试（单 worker）
        run: pnpm --filter @wechatsync/core exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism
      - name: 核心类型检查
        run: pnpm --filter @wechatsync/core typecheck
      - name: 构建核心
        run: pnpm --filter @wechatsync/core build
      - name: 构建扩展（含注册检查）
        run: pnpm --filter @wechatsync/extension build
      - name: 安装隔离的烟测浏览器
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.browser_smoke)
        run: |
          npm install --prefix "$RUNNER_TEMP/codefather-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/codefather-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: 验证真实编辑器恢复本地草稿（不发布）
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.browser_smoke)
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/codefather-browser/node_modules/playwright
        run: node scripts/verify-codefather.cjs
      - name: 保存烟测证据
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.browser_smoke))
        uses: actions/upload-artifact@v4
        with:
          name: codefather-browser-evidence
          path: codefather-smoke-output/
          if-no-files-found: ignore
